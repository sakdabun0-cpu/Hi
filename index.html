<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      color: #ff7518;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    h1 { font-size: 3rem; margin-bottom: 10px; }
    p { font-size: 1.5rem; color: #ffffff; margin-bottom: 30px; }
    .buttons { display: flex; gap: 20px; }
    button {
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #siBtn { background-color: #ff7518; color: #121212; }
    #noBtn { background-color: #333333; color: #ffffff; }
    
    /* Realistic Jump Scare Overlay */
    #scareOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #000000;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      overflow: hidden;
    }
    #scareCanvas {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: contrast(1.45) brightness(0.95);
      animation: violentShake 0.09s infinite;
    }
    @keyframes violentShake {
      0% { transform: scale(1.12) translate(-14px, 8px) rotate(-1.5deg); }
      25% { transform: scale(1.24) translate(16px, -10px) rotate(1.5deg); }
      50% { transform: scale(1.18) translate(-10px, -14px) rotate(-1deg); }
      75% { transform: scale(1.28) translate(14px, 12px) rotate(2deg); }
      100% { transform: scale(1.12) translate(-14px, 8px) rotate(-1.5deg); }
    }
  </style>
</head>
<body>

  <div id="mainContent">
    <h1>Halloween</h1>
    <p>¿Quieres celebrar Halloween conmigo?</p>
    <div class="buttons">
      <button id="siBtn">🎃 Si</button>
      <button id="noBtn">🕸 No</button>
    </div>
  </div>

  <div id="scareOverlay">
    <canvas id="scareCanvas" width="800" height="800"></canvas>
  </div>

  <script>
    const siBtn = document.getElementById('siBtn');
    const noBtn = document.getElementById('noBtn');
    const scareOverlay = document.getElementById('scareOverlay');
    const canvas = document.getElementById('scareCanvas');
    const ctx = canvas.getContext('2d');

    // Render photorealistic-style shaded Skinwalker on Canvas
    function drawRealisticSkinwalker() {
      const w = canvas.width;
      const h = canvas.height;

      // Pitch black night background
      ctx.fillStyle = '#030303';
      ctx.fillRect(0, 0, w, h);

      // Harsh flashlight beam lighting from front-bottom
      const bgGlow = ctx.createRadialGradient(400, 410, 40, 400, 400, 390);
      bgGlow.addColorStop(0, '#3b3731');
      bgGlow.addColorStop(0.55, '#12100e');
      bgGlow.addColorStop(1, '#000000');
      ctx.fillStyle = bgGlow;
      ctx.fillRect(0, 0, w, h);

      // Gaunt, stretched human-like skull & skin structure
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(230, 120);
      ctx.bezierCurveTo(175, 250, 195, 430, 235, 530); // Left cheekbone & hollow
      ctx.bezierCurveTo(265, 635, 325, 735, 400, 745); // Elongated jaw
      ctx.bezierCurveTo(475, 735, 535, 635, 565, 530); // Right jaw
      ctx.bezierCurveTo(605, 430, 625, 250, 570, 120); // Right temple
      ctx.bezierCurveTo(500, 30, 300, 30, 230, 120);   // Cranium
      ctx.closePath();

      // Pale, sickly skin gradient with harsh flash highlights
      const skinGrad = ctx.createRadialGradient(390, 340, 30, 400, 400, 340);
      skinGrad.addColorStop(0, '#d8d2c5');
      skinGrad.addColorStop(0.45, '#9e9789');
      skinGrad.addColorStop(0.8, '#4a453d');
      skinGrad.addColorStop(1, '#141210');
      ctx.fillStyle = skinGrad;
      ctx.fill();

      // Deep sunken cheek shadows & temple contours
      ctx.fillStyle = 'rgba(15, 12, 10, 0.65)';
      ctx.beginPath();
      ctx.ellipse(255, 455, 38, 95, -0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(545, 455, 38, 95, 0.22, 0, Math.PI * 2);
      ctx.fill();

      // Forehead tension veins & wrinkles
      ctx.strokeStyle = 'rgba(45, 35, 30, 0.45)';
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(295, 185 + i * 16);
        ctx.quadraticCurveTo(400, 175 + i * 16, 505, 185 + i * 16);
        ctx.stroke();
      }

      // Deep sunken orbital sockets
      function drawEye(cx, cy, tilt) {
        const socketGrad = ctx.createRadialGradient(cx, cy, 12, cx, cy, 68);
        socketGrad.addColorStop(0, '#000000');
        socketGrad.addColorStop(0.65, '#0c0a09');
        socketGrad.addColorStop(1, 'rgba(70, 63, 55, 0)');
        ctx.fillStyle = socketGrad;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 64, 54, tilt, 0, Math.PI * 2);
        ctx.fill();

        // Unblinking wide-open bloodshot sclera
        ctx.fillStyle = '#c9b8b4';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 4, 34, 24, tilt * 0.5, 0, Math.PI * 2);
        ctx.fill();

        // Dark dilated iris & pinprick light reflection (eyeshine)
        ctx.fillStyle = '#141110';
        ctx.beginPath();
        ctx.arc(cx, cy + 4, 15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(cx, cy + 4, 9, 0, Math.PI * 2);
        ctx.fill();

        // Predatory camera flash reflection dot
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx - 5, cy - 1, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }

      drawEye(315, 305, -0.15);
      drawEye(485, 305, 0.15);

      // Skeletal nose bridge & dark nasal cavities
      ctx.fillStyle = '#14110f';
      ctx.beginPath();
      ctx.moveTo(395, 375);
      ctx.lineTo(376, 425);
      ctx.lineTo(396, 418);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(405, 375);
      ctx.lineTo(424, 425);
      ctx.lineTo(404, 418);
      ctx.closePath();
      ctx.fill();

      // Unnaturally stretched, tearing mouth cavity
      ctx.beginPath();
      ctx.moveTo(270, 485);
      ctx.bezierCurveTo(320, 465, 480, 465, 530, 485);
      ctx.bezierCurveTo(510, 665, 290, 665, 270, 485);
      ctx.closePath();
      ctx.fillStyle = '#070101';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#3b1515';
      ctx.stroke();

      // Realistic stained human-like teeth (upper and lower rows)
      function drawTeethRow(yBase, direction) {
        const count = 12;
        const startX = 292;
        const step = 18;
        for (let i = 0; i < count; i++) {
          const tx = startX + i * step;
          const curveOffset = Math.pow((i - 5.5), 2) * 0.65 * direction;
          const toothH = 22 + (i % 3) * 3;
          ctx.fillStyle = i % 2 === 0 ? '#cfc7b0' : '#b8ae94';
          ctx.beginPath();
          ctx.roundRect(tx, yBase + curveOffset, 14, toothH * direction, 3);
          ctx.fill();
          ctx.strokeStyle = '#3d3528';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }
      drawTeethRow(478, 1);
      drawTeethRow(615, -1);

      ctx.restore();

      // Add night-vision / low-light camera film grain
      const imgData = ctx.getImageData(0, 0, w, h);
      const pixels = imgData.data;
      for (let i = 0; i < pixels.length; i += 4) {
        const noise = (Math.random() - 0.5) * 48;
        pixels[i] = Math.min(255, Math.max(0, pixels[i] + noise));
        pixels[i + 1] = Math.min(255, Math.max(0, pixels[i + 1] + noise));
        pixels[i + 2] = Math.min(255, Math.max(0, pixels[i + 2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);
    }

    drawRealisticSkinwalker();

    // Happy ending if they click Si
    siBtn.addEventListener('click', () => {
      document.getElementById('mainContent').innerHTML = 
        '<h1>🎃 ¡Genial! 🎃</h1><p>Nos vemos en Halloween...</p>';
    });

    // Trigger jump scare + realistic layered scream + static burst
    noBtn.addEventListener('click', () => {
      scareOverlay.style.display = 'flex';
      
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // 1. White noise static burst (camera distortion)
      const bufferSize = audioCtx.sampleRate * 2.0;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.45, audioCtx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.0);
      whiteNoise.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      // 2. Dissonant banshee shriek
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const screamGain = audioCtx.createGain();

      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(1650, audioCtx.currentTime);
      osc1.frequency.exponentialRampToValueAtTime(380, audioCtx.currentTime + 2.0);

      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(1715, audioCtx.currentTime); // Dissonant clash
      osc2.frequency.exponentialRampToValueAtTime(190, audioCtx.currentTime + 2.0);

      screamGain.gain.setValueAtTime(0.9, audioCtx.currentTime);
      screamGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.0);

      osc1.connect(screamGain);
      osc2.connect(screamGain);
      screamGain.connect(audioCtx.destination);

      whiteNoise.start();
      osc1.start();
      osc2.start();
      whiteNoise.stop(audioCtx.currentTime + 2.0);
